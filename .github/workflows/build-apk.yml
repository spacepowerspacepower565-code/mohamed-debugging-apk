name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VERSION_OUTPUT"

          JAVA_MAJOR=$(java -version 2>&1 | sed -E -n 's/.*version "([0-9]+).*/\1/p')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version from '$JAVA_VERSION_OUTPUT'"
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than required version 17!"
            exit 1
          fi

          echo "Java version requirement satisfied (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or verify ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "::warning::Expected APK at $TARGET_APK not found directly. Checking app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            echo "::error::The expected debug APK was not found at $TARGET_APK"
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Found APK at $TARGET_APK but the file is empty!"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "::error::$TARGET_APK does not have a .apk extension!"
              exit 1
              ;;
          esac

          echo "APK verified successfully: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$ASSET_DIR"

          REPO_NAME=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is missing or empty!"
            exit 1
          fi

          RELEASE_NOTES=$(cat <<EOF
### 📱 Android Debug APK Build

- **Build Type:** Automatically generated debug APK
- **Builder:** GitHub Actions
- **Run Number:** ${GITHUB_RUN_NUMBER}
- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
- **Source Commit:** ${GITHUB_SHA}
- **Asset Filename:** ${{ steps.prepare_asset.outputs.asset_name }}

> ⚠️ **Note:** This APK is intended for testing and development purposes. It is signed with a temporary debug keystore and is not a Play Store production release.
EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release Summary & Download Instructions ==="
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "## 🚀 Android Build & Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **AGP Version:** 9.1.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** JDK 17 (Temurin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Version:** 9.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Command:** \`gradle :app:assembleDebug --stacktrace --no-daemon\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK Path:** \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Checking release status with GitHub CLI..."
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release created successfully: $RELEASE_URL"

            echo "### ✅ Release Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "Direct release link: [**$RELEASE_TITLE**]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📲 **Download Instructions:** You can download the APK file (\`$ASSET_NAME\`) directly from the **Assets** section of the [Release Page]($RELEASE_URL) to install on your phone." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the workflow summary." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was not completed or failed. The Actions artifact remains available."
            echo "### ⚠️ Release Publishing Notice" >> $GITHUB_STEP_SUMMARY
            echo "GitHub Release publishing did not complete, but the debug APK was **built successfully**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **How to Download:** The debug APK is safely preserved as a workflow artifact. Download the **\`app-debug-apk\`** artifact directly from this run's summary page." >> $GITHUB_STEP_SUMMARY
          fi
